name: Validate

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate .env
        run: |
          grep -oP "(?<=Name = \")([^\"]+)" services.psd1 | while read name; do
            prefix=$(echo "$name" | tr '[:lower:]-' '[:upper:]_')
            echo "${prefix}_PATH=/placeholder"
          done > .env

      - name: Validate docker-compose
        run: docker compose config

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $errors += "$($_.Name): $($parseErrors -join ', ')"
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host -ForegroundColor Red $_ }
            exit 1
          }
